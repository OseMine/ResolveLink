name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: 'Optional version suffix (e.g. "beta", "rc1")'
        required: false
        type: string
      platforms:
        description: 'Platforms to build (comma-separated: win,mac,linux)'
        required: false
        default: 'win,mac,linux'
        type: choice
        options:
          - 'win,mac,linux'
          - 'win'
          - 'mac'
          - 'linux'
  schedule:
    # Weekly build on Monday 06:00 UTC to catch breakages early
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Determine which platforms to build
  determine-platforms:
    name: Determine Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set platform matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORMS="${{ github.event.inputs.platforms }}"
          else
            PLATFORMS="win,mac,linux"
          fi
          
          # Build matrix JSON
          MATRIX='{"include":['
          FIRST=true
          for p in $(echo "$PLATFORMS" | tr ',' ' '); do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              MATRIX="$MATRIX,"
            fi
            case "$p" in
              win)
                MATRIX="$MATRIX{\"platform\":\"win\",\"os\":\"windows-latest\",\"artifact\":\"*.exe\"}"
                ;;
              mac)
                MATRIX="$MATRIX{\"platform\":\"mac\",\"os\":\"macos-latest\",\"artifact\":\"*.dmg\"}"
                ;;
              linux)
                MATRIX="$MATRIX{\"platform\":\"linux\",\"os\":\"ubuntu-latest\",\"artifact\":\"*.AppImage\"}"
                ;;
            esac
          done
          MATRIX="$MATRIX]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: determine-platforms
    env:
      ABLETON_SDK_URL: ${{ secrets.ABLETON_SDK_PATH }}
      REAPER_SDK_URL: ${{ secrets.REAPER_SDK_PATH }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config curl

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress
          refreshenv

      - name: Download and extract REAPER SDK
        if: startsWith(env.REAPER_SDK_URL, 'http')
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/reaper-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading REAPER SDK from $REAPER_SDK_URL..."
          REAPER_SDK_REPO="${REAPER_SDK_URL%.git}"
          if [[ "$REAPER_SDK_REPO" =~ ^https://github\.com/[^/]+/[^/]+/?$ ]]; then
            git clone --depth 1 "$REAPER_SDK_URL" "${SDK_DIR}/source"
          else
            curl --fail --location --silent --show-error -o "${SDK_DIR}/reaper-sdk.zip" "$REAPER_SDK_URL"
            unzip -tq "${SDK_DIR}/reaper-sdk.zip"
            echo "Extracting REAPER SDK..."
            unzip -q "${SDK_DIR}/reaper-sdk.zip" -d "$SDK_DIR"
          fi
          SDK_HEADER=$(find "$SDK_DIR" -type f -name "reaper_plugin.h" -print -quit)
          SDK_INCLUDE_DIR="${SDK_HEADER%/*}"
          if [ -z "$SDK_INCLUDE_DIR" ]; then
            echo "REAPER SDK archive does not contain reaper_plugin.h" >&2
            exit 1
          fi
          echo "REAPER_SDK_PATH=$SDK_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "REAPER SDK headers found in $SDK_INCLUDE_DIR"

      - name: Download and extract Ableton SDK
        if: startsWith(env.ABLETON_SDK_URL, 'http')
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/ableton-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading Ableton Extension SDK..."
          curl --fail --location --silent --show-error -o "${SDK_DIR}/ableton-sdk.zip" "$ABLETON_SDK_URL"
          echo "Extracting Ableton SDK..."
          unzip -q "${SDK_DIR}/ableton-sdk.zip" -d "$SDK_DIR"
          SDK_HEADER=$(find "$SDK_DIR" -type f -name "Ableton.h" -print -quit)
          SDK_INCLUDE_DIR="${SDK_HEADER%/*}"
          if [ -z "$SDK_INCLUDE_DIR" ]; then
            echo "Ableton SDK archive does not contain Ableton.h" >&2
            exit 1
          fi
          echo "ABLETON_SDK_PATH=$SDK_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "Ableton SDK headers found in $SDK_INCLUDE_DIR"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Bundle server
        run: npm run build:server

      - name: Build native extensions (Ableton/REAPER)
        run: npm run build:native

      - name: Set version from tag (if pushed tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Append version suffix (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version-suffix != ''
        shell: bash
        run: |
          npm version "${npm_package_version}-${{ github.event.inputs.version-suffix }}" --no-git-tag-version --allow-same-version

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-electron/${{ matrix.artifact }}
            dist-electron/*.blockmap

  # Summary job - runs after all platform builds complete
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List built artifacts
        run: |
          echo "## Built Installers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" \) | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "- \`$file\` ($size)" >> $GITHUB_STEP_SUMMARY
          done
          if [ ! -f artifacts/*.exe ] && [ ! -f artifacts/*.dmg ] && [ ! -f artifacts/*.AppImage ]; then
            echo "⚠️ No installer artifacts found!" >> $GITHUB_STEP_SUMMARY
          fi