name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version-suffix:
        description: 'Optional version suffix (e.g. "beta", "rc1")'
        required: false
        type: string
      platforms:
        description: 'Platforms to build (comma-separated: win,mac,linux)'
        required: false
        default: 'win,mac,linux'
        type: choice
        options:
          - 'win,mac,linux'
          - 'win'
          - 'mac'
          - 'linux'
  schedule:
    # Weekly build on Monday 06:00 UTC to catch breakages early
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            os: windows-latest
            artifact: '*.exe'
          - platform: mac
            os: macos-latest
            artifact: '*.dmg'
          - platform: linux
            os: ubuntu-latest
            artifact: '*.AppImage'

    # Skip platforms not requested in workflow_dispatch
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, matrix.platform)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Bundle server
        run: npm run build:server

      - name: Set version from tag (if pushed tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Append version suffix (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version-suffix != ''
        shell: bash
        run: |
          npm version "${npm_package_version}-${{ github.event.inputs.version-suffix }}" --no-git-tag-version --allow-same-version

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-electron/${{ matrix.artifact }}
            dist-electron/*.blockmap

  # Summary job - runs after all platform builds complete
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List built artifacts
        run: |
          echo "## Built Installers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" \) | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "- \`$file\` ($size)" >> $GITHUB_STEP_SUMMARY
          done
          if [ ! -f artifacts/*.exe ] && [ ! -f artifacts/*.dmg ] && [ ! -f artifacts/*.AppImage ]; then
            echo "⚠️ No installer artifacts found!" >> $GITHUB_STEP_SUMMARY
          fi