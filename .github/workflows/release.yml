name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-desktop:
    needs: test
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config curl

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress
          refreshenv

      - name: Download and extract REAPER SDK
        if: env.REAPER_SDK_PATH != '' && startsWith(env.REAPER_SDK_PATH, 'http')
        env:
          REAPER_SDK_URL: ${{ secrets.REAPER_SDK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/reaper-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading REAPER SDK..."
          curl -L -o "${SDK_DIR}/reaper-sdk.zip" "$REAPER_SDK_URL"
          echo "Extracting REAPER SDK..."
          unzip -q "${SDK_DIR}/reaper-sdk.zip" -d "$SDK_DIR"
          EXTRACTED_DIR=$(find "$SDK_DIR" -maxdepth 1 -type d -name "reaper-sdk-*" | head -1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "$SDK_DIR" ]; then
            mv "$EXTRACTED_DIR"/* "$SDK_DIR"/
            rmdir "$EXTRACTED_DIR"
          fi
          echo "REAPER_SDK_PATH=$SDK_DIR" >> "$GITHUB_ENV"
          echo "REAPER SDK downloaded to $SDK_DIR"

      - name: Download and extract Ableton SDK
        if: env.ABLETON_SDK_PATH != '' && startsWith(env.ABLETON_SDK_PATH, 'http')
        env:
          ABLETON_SDK_URL: ${{ secrets.ABLETON_SDK_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/ableton-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading Ableton Extension SDK..."
          curl -L -o "${SDK_DIR}/ableton-sdk.zip" "$ABLETON_SDK_URL"
          echo "Extracting Ableton SDK..."
          unzip -q "${SDK_DIR}/ableton-sdk.zip" -d "$SDK_DIR"
          EXTRACTED_DIR=$(find "$SDK_DIR" -maxdepth 1 -type d ! -path "$SDK_DIR" | head -1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "$SDK_DIR" ]; then
            mv "$EXTRACTED_DIR"/* "$SDK_DIR"/
            rmdir "$EXTRACTED_DIR"
          fi
          echo "ABLETON_SDK_PATH=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Ableton SDK downloaded to $SDK_DIR"

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build frontend
        run: npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Bundle server
        run: npm run build:server

      - name: Build native extensions (Ableton/REAPER)
        env:
          ABLETON_SDK_PATH: ${{ secrets.ABLETON_SDK_PATH }}
          REAPER_SDK_PATH: ${{ secrets.REAPER_SDK_PATH }}
        run: npm run build:native

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.blockmap

  release:
    needs: [test, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Inject version into installer
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          sed "s|__RELEASE_TAG__|${VERSION}|g" install.lua > install-release.lua
          echo "Installer patched for ${VERSION}"

      - name: Generate release notes with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash
          prompt: |
            Generate a changelog for ResolveLink ${{ steps.tag.outputs.version }}.
            Look at the git log since the previous tag to understand what changed.
            Write ONLY the changelog to CHANGELOG.md.

            Style rules (match the existing release notes):
            - Group under ### Bug Fixes and ### Improvements (add other ### sections if relevant)
            - Each bullet: - **Area**: Short description of what changed
            - Area examples: AE workflow, REAPER workflow, REAPER scripts, Setup, Panel, Server, Electron UI, Desktop App
            - Concise, technical but user-facing, no fluff, no "we" language
            - No code fences around the output

      - name: Assemble release notes
        run: |
          cat CHANGELOG.md > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          cat RELEASE_BODY.md >> RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ResolveLink ${{ steps.tag.outputs.version }}"
          body_path: RELEASE_BODY.md
          files: |
            install-release.lua
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.blockmap
          draft: false
          prerelease: false

  deploy-web:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Get version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web with release version
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.tag.outputs.version }}
        run: npm run build

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: web
          vercel-args: "--prod"
          vercel-version: "56.4.0"
