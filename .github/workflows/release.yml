name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-desktop:
    needs: test
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build frontend
        run: npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Bundle server
        run: npm run build:server

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.blockmap

  release:
    needs: [test, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Inject version into installer
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          sed "s|__RELEASE_TAG__|${VERSION}|g" install.lua > install-release.lua
          echo "Installer patched for ${VERSION}"

      - name: Generate release notes with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash
          prompt: |
            Generate a changelog for ResolveLink ${{ steps.tag.outputs.version }}.
            Look at the git log since the previous tag to understand what changed.
            Write ONLY the changelog to CHANGELOG.md.

            Style rules (match the existing release notes):
            - Group under ### Bug Fixes and ### Improvements (add other ### sections if relevant)
            - Each bullet: - **Area**: Short description of what changed
            - Area examples: AE workflow, REAPER workflow, REAPER scripts, Setup, Panel, Server, Electron UI, Desktop App
            - Concise, technical but user-facing, no fluff, no "we" language
            - No code fences around the output

      - name: Assemble release notes
        run: |
          cat CHANGELOG.md > RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          cat RELEASE-BODY.md >> RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ResolveLink ${{ steps.tag.outputs.version }}"
          body_path: RELEASE_BODY.md
          files: |
            install-release.lua
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.blockmap
          draft: false
          prerelease: false
