name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify server starts
        run: |
          node packages/server/src/index.js &
          sleep 3
          curl -sf http://127.0.0.1:3030/api/health || exit 1
          kill %1 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: packages/ui

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    # Only run desktop packaging on main/master pushes, tags, or manual dispatch
    # to avoid heavy macOS/Linux builds on every PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Bundle server
        run: npm run build:server

      - name: Download and extract REAPER SDK
        if: env.REAPER_SDK_PATH != '' && startsWith(env.REAPER_SDK_PATH, 'http')
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/reaper-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading REAPER SDK..."
          curl -L -o "${SDK_DIR}/reaper-sdk.zip" "${{ secrets.REAPER_SDK_PATH }}"
          echo "Extracting REAPER SDK..."
          unzip -q "${SDK_DIR}/reaper-sdk.zip" -d "$SDK_DIR"
          EXTRACTED_DIR=$(find "$SDK_DIR" -maxdepth 1 -type d -name "reaper-sdk-*" | head -1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "$SDK_DIR" ]; then
            mv "$EXTRACTED_DIR"/* "$SDK_DIR"/
            rmdir "$EXTRACTED_DIR"
          fi
          echo "REAPER_SDK_PATH=$SDK_DIR" >> "$GITHUB_ENV"
          echo "REAPER SDK downloaded to $SDK_DIR"

      - name: Download and extract Ableton SDK
        if: env.ABLETON_SDK_PATH != '' && startsWith(env.ABLETON_SDK_PATH, 'http')
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/ableton-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading Ableton Extension SDK..."
          curl -L -o "${SDK_DIR}/ableton-sdk.zip" "${{ secrets.ABLETON_SDK_PATH }}"
          echo "Extracting Ableton SDK..."
          unzip -q "${SDK_DIR}/ableton-sdk.zip" -d "$SDK_DIR"
          EXTRACTED_DIR=$(find "$SDK_DIR" -maxdepth 1 -type d ! -path "$SDK_DIR" | head -1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "$SDK_DIR" ]; then
            mv "$EXTRACTED_DIR"/* "$SDK_DIR"/
            rmdir "$EXTRACTED_DIR"
          fi
          echo "ABLETON_SDK_PATH=$SDK_DIR" >> "$GITHUB_ENV"
          echo "Ableton SDK downloaded to $SDK_DIR"

      - name: Build native extensions (Ableton/REAPER)
        env:
          ABLETON_SDK_PATH: ${{ secrets.ABLETON_SDK_PATH }}
          REAPER_SDK_PATH: ${{ secrets.REAPER_SDK_PATH }}
        run: npm run build:native

      - name: Smoke-test bundled server
        shell: bash
        run: |
          node packages/server/dist/server.cjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3030/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3030/api/health
          curl -sf http://127.0.0.1:3030/api/diagnostics > /dev/null
          kill $SERVER_PID 2>/dev/null || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.blockmap
