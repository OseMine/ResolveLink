name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify server starts
        run: |
          node packages/server/src/index.js &
          sleep 3
          curl -sf http://127.0.0.1:3030/api/health || exit 1
          kill %1 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: packages/ui

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      ABLETON_SDK_URL: ${{ secrets.ABLETON_SDK_PATH }}
      REAPER_SDK_URL: ${{ secrets.REAPER_SDK_PATH }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    # Only run desktop packaging on main/master pushes, tags, or manual dispatch
    # to avoid heavy macOS/Linux builds on every PR
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build icons
        run: npm run build:icons

      - name: Bundle server
        run: npm run build:server

      - name: Download and extract REAPER SDK
        if: startsWith(env.REAPER_SDK_URL, 'http')
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/reaper-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading REAPER SDK..."
          REAPER_SDK_REPO="${REAPER_SDK_URL%.git}"
          if [[ "$REAPER_SDK_REPO" =~ ^https://github\.com/[^/]+/[^/]+/?$ ]]; then
            git clone --depth 1 "$REAPER_SDK_URL" "${SDK_DIR}/source"
          else
            curl --fail --location --silent --show-error -o "${SDK_DIR}/reaper-sdk.zip" "$REAPER_SDK_URL"
            unzip -tq "${SDK_DIR}/reaper-sdk.zip"
            echo "Extracting REAPER SDK..."
            unzip -q "${SDK_DIR}/reaper-sdk.zip" -d "$SDK_DIR"
          fi
          SDK_HEADER=$(find "$SDK_DIR" -type f -name "reaper_plugin.h" -print -quit)
          SDK_INCLUDE_DIR="${SDK_HEADER%/*}"
          if [ -z "$SDK_INCLUDE_DIR" ]; then
            echo "REAPER SDK archive does not contain reaper_plugin.h" >&2
            exit 1
          fi
          echo "REAPER_SDK_PATH=$SDK_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "REAPER SDK headers found in $SDK_INCLUDE_DIR"

      - name: Download and extract Ableton SDK
        if: startsWith(env.ABLETON_SDK_URL, 'http')
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${RUNNER_TEMP}/ableton-sdk"
          mkdir -p "$SDK_DIR"
          echo "Downloading Ableton Extension SDK..."
          curl --fail --location --silent --show-error -o "${SDK_DIR}/ableton-sdk.zip" "$ABLETON_SDK_URL"
          echo "Extracting Ableton SDK..."
          unzip -q "${SDK_DIR}/ableton-sdk.zip" -d "$SDK_DIR"
          SDK_HEADER=$(find "$SDK_DIR" -type f -name "Ableton.h" -print -quit)
          SDK_INCLUDE_DIR="${SDK_HEADER%/*}"
          if [ -z "$SDK_INCLUDE_DIR" ]; then
            echo "Ableton SDK archive does not contain Ableton.h" >&2
            exit 1
          fi
          echo "ABLETON_SDK_PATH=$SDK_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "Ableton SDK headers found in $SDK_INCLUDE_DIR"

      - name: Build native extensions (Ableton/REAPER)
        run: npm run build:native

      - name: Smoke-test bundled server
        shell: bash
        run: |
          node packages/server/dist/server.cjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3030/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3030/api/health
          curl -sf http://127.0.0.1:3030/api/diagnostics > /dev/null
          kill $SERVER_PID 2>/dev/null || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.blockmap
